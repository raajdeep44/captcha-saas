<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Stats</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="website_style.css">
</head>
<body>
  <div class="container">
    <h2 class="title">📊 Website Statistics</h2>

    <!-- Stats Cards -->
    <div id="statsCards" class="stats-grid">
      <div class="card blue">
        <h3 id="siteCaptchaCount">0</h3>
        <p>Total Captchas</p>
      </div>
      <div class="card green">
        <h3 id="siteSuccessRate">0</h3>
        <p>Success Rate</p> 
      </div>
      <div class="card purple">
        <h3 id="last30days">0</h3>
        <p>Last 30 Days</p>
      </div>
    </div>

    <!-- Recent Activity Table -->
    <div class="recent-activity">
      <h3>Recent Activity</h3>
      <table id="activityTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Total</th>
            <th>Success</th>
            <th>Failed</th>
            <th>Sucess Rate</th>
          </tr>
        </thead>
        <tbody>
          <!-- Example static row -->
          <tr>
            <td>17 Aug 2025</td>
            <td>10</td>
            <td>8</td>
            <td>2</td>
            <td>80%</td>  
          </tr>
          <tr>
            <td>18 Aug 2025</td>
            <td>6</td>
            <td>3</td>
            <td>3</td>
            <td>50%</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Back Button -->
    <div class="back-btn">
      <button onclick="window.history.back()" class="btn btn-primary">
        ← Back to Dashboard
      </button>
    </div>
  </div>
  <script src="website_stats.js"></script>
</body>
</html>
